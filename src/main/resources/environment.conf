include "common.conf"

pulsar {
  consumer {
    enabled=false
  }
  producer {
    enabled=false
  }
}

redis {
  enabled=false
  customHealthCheckEnabled="false"
  customHealthCheckEnabled=${?REDIS_HEALTH_CHECK_ENABLED}
}

redisCluster {
  enabled=true
  healthCheck=true
  masterName=${?REDIS_CLUSTER_MASTER_NAME}
  sentinels=${?REDIS_CLUSTER_SENTINELS}
}

bootstrapper {
  redisTTLInDays = 3
  redisTTLInDays=${?REDIS_TTL_DAYS}
  queryHistoryInDays = 3
  queryHistoryInDays=${?QUERY_HISTORY_DAYS}
  queryFutureInDays = 90
  queryFutureInDays=${?QUERY_FUTURE_DAYS}
}
